[project]
name = "collabsta-backend"
version = "0.1.0"
description = "Collabsta API service"
readme = "README.md"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
src = ["app", "tests"]
line-length = 100

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "ASYNC",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"alembic/**/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 0
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true

plugins = ["pydantic.mypy"]
