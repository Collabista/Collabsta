services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: collabsta
      POSTGRES_PASSWORD: collabsta
      POSTGRES_DB: collabsta
    ports:
      - "5432:5432"
    volumes:
      - collabsta_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  collabsta_pg_data:
